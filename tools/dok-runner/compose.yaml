name: agents
services:
  runner:
    image: agents-runner:pi-1.1.0
    build: .
    container_name: agents
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "/usr/local/bin/agent-healthcheck", "/home/agent/.config/agent-workflow/dok.json"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    cpus: 2
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 512
    volumes:
      - home:/home/agent
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      # The existing profile allows bwrap's unprivileged user namespaces.
      - seccomp=${AGENTS_SECCOMP_PROFILE:-${HOME}/.config/dok-dev/seccomp.json}
volumes:
  home:
    # Created once with `docker volume create agents-home`; holds login, config, repos and state.
    name: agents-home
    external: true
