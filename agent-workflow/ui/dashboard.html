<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents Hub</title>
<style>
  /* Defaults; a host's own theme variables (set inline on <html>) win over these. */
  :root {
    color-scheme: light dark;
    --color-background-primary: #ffffff; --color-background-secondary: #f5f5f3; --color-background-tertiary: #ebebe8;
    --color-text-primary: #1c1c1a; --color-text-secondary: #5f5f5a; --color-text-tertiary: #8a8a84;
    --color-border-primary: #d9d8d3; --color-border-secondary: #e8e7e3;
    --color-text-success: #1f7a3a; --color-text-danger: #b42318; --color-text-warning: #8a5a00; --color-text-info: #1f5fbf;
    --color-background-success: #e6f4ea; --color-background-danger: #fdecea; --color-background-warning: #fdf3dc; --color-background-info: #e8f0fc;
    --color-ring-primary: #1f5fbf;
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --border-radius-sm: 6px; --border-radius-md: 8px; --border-radius-lg: 12px;
  }
  :root[data-theme="dark"] {
    --color-background-primary: #1b1b1a; --color-background-secondary: #242422; --color-background-tertiary: #2e2e2b;
    --color-text-primary: #ecebe6; --color-text-secondary: #a9a8a1; --color-text-tertiary: #7d7c76;
    --color-border-primary: #3a3a37; --color-border-secondary: #2f2f2c;
    --color-text-success: #6fcf8b; --color-text-danger: #ff8a80; --color-text-warning: #f0c060; --color-text-info: #8ab4ff;
    --color-background-success: #1d3324; --color-background-danger: #3a1f1d; --color-background-warning: #3a3018; --color-background-info: #1d2a40;
    --color-ring-primary: #8ab4ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--color-background-primary); color: var(--color-text-primary);
    font: 14px/1.45 var(--font-sans); padding: var(--inset-top, 0) var(--inset-right, 0) var(--inset-bottom, 0) var(--inset-left, 0); }
  .app { padding: 14px 16px 16px; max-width: 920px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 16px; font-weight: 600; margin: 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--color-background-secondary); color: var(--color-text-secondary); }
  .chip.on { background: var(--color-background-info); color: var(--color-text-info); }
  .chip.attn { background: var(--color-background-warning); color: var(--color-text-warning); }
  button { font: inherit; font-size: 13px; color: var(--color-text-primary); background: var(--color-background-secondary);
    border: 1px solid var(--color-border-primary); border-radius: var(--border-radius-sm); padding: 4px 10px; cursor: pointer; }
  button:hover { background: var(--color-background-tertiary); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--color-ring-primary); outline-offset: 1px; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--color-text-primary); color: var(--color-background-primary); border-color: transparent; }
  button.ok { color: var(--color-text-success); } button.no { color: var(--color-text-danger); }
  nav { display: flex; gap: 2px; margin: 12px 0 10px; border-bottom: 1px solid var(--color-border-secondary); }
  nav button { background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 6px 10px; color: var(--color-text-secondary); }
  nav button[aria-selected="true"] { color: var(--color-text-primary); border-bottom-color: var(--color-text-primary); }
  .badge { font-size: 11px; margin-left: 4px; padding: 0 6px; border-radius: 999px; background: var(--color-background-warning); color: var(--color-text-warning); }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .row { border: 1px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 9px 11px; background: var(--color-background-primary); }
  .row.click { cursor: pointer; } .row.click:hover { background: var(--color-background-secondary); }
  .line { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .name { font-weight: 600; } .grow { flex: 1; min-width: 0; }
  .muted { color: var(--color-text-secondary); } .small { font-size: 12px; }
  .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 12px; color: var(--color-text-tertiary); margin-top: 2px; overflow-wrap: anywhere; }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 999px; white-space: nowrap; background: var(--color-background-secondary); color: var(--color-text-secondary); }
  .pill.completed { background: var(--color-background-success); color: var(--color-text-success); }
  .pill.failed, .pill.interrupted { background: var(--color-background-danger); color: var(--color-text-danger); }
  .pill.running { background: var(--color-background-info); color: var(--color-text-info); }
  .pill.unknown { background: var(--color-background-warning); color: var(--color-text-warning); }
  .body { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 6px; font-size: 13px; }
  pre { font: 12px/1.45 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; background: var(--color-background-secondary);
    padding: 8px 10px; border-radius: var(--border-radius-sm); margin: 6px 0 0; max-height: 360px; overflow: auto; }
  .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .actions input { flex: 1; min-width: 140px; }
  form { display: grid; gap: 8px; }
  label { font-size: 12px; color: var(--color-text-secondary); display: grid; gap: 3px; }
  input, textarea, select { font: inherit; color: var(--color-text-primary); background: var(--color-background-primary);
    border: 1px solid var(--color-border-primary); border-radius: var(--border-radius-sm); padding: 6px 8px; width: 100%; }
  textarea { min-height: 76px; resize: vertical; }
  .empty { color: var(--color-text-tertiary); padding: 18px 4px; text-align: center; }
  .note { font-size: 12px; color: var(--color-text-danger); margin-top: 8px; }
  .back { margin-bottom: 8px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 8px 0 0; font-size: 12px; }
  dt { color: var(--color-text-tertiary); } dd { margin: 0; overflow-wrap: anywhere; }
  .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Agents Hub</h1>
    <div class="chips" id="chips"></div>
    <button id="refresh" title="Refresh">Refresh</button>
    <button id="expand" title="Full screen" hidden>Expand</button>
    <button id="new" class="primary" hidden>Run…</button>
  </header>
  <nav role="tablist" id="tabs"></nav>
  <main id="view"><div class="empty">Loading…</div></main>
  <div class="note" id="error" hidden></div>
</div>
<!-- MCP Apps bridge, inlined by ui/dashboard.mjs (hosts block script URLs); its own module so names can't clash. -->
<script type="module">/*__EXT_APPS_BUNDLE__*/</script>
<script type="module">/*__HEALTH_BUNDLE__*/</script>
<script type="module">
const { App, applyHostStyleVariables } = globalThis.ExtApps;
const { healthOf, healthLabels, dashboardHealth } = globalThis.AgentsHealth;

// ---------- state ----------
const S = { data: null, tab: 'runs', detail: null, form: null, busy: new Set(), poll: null };
const app = new App({ name: 'AgentsDashboard', version: '0.1.0' }, { availableDisplayModes: ['inline', 'fullscreen'] }, { autoResize: true });

// ---------- tiny DOM helper (text only: agent output is never parsed as HTML) ----------
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs ?? {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
const ago = (iso) => {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (!Number.isFinite(s) || s < 0) return '';
  return s < 60 ? `${Math.floor(s)}s ago` : s < 3600 ? `${Math.floor(s / 60)}m ago` : s < 86400 ? `${Math.floor(s / 3600)}h ago` : `${Math.floor(s / 86400)}d ago`;
};
const firstLine = (t) => String(t ?? '').trim().split('\n')[0];
const home = (p) => String(p ?? '').replace(/^\/Users\/[^/]+/, '~');
// Local run records list tools and blocked commands; hosted ones only count them.
const list = (v, sep, unit) => (Array.isArray(v) ? (v.length ? v.join(sep) : null) : v > 0 ? `${v} ${unit}` : null);

// ---------- server calls ----------
function showError(msg) { const e = document.getElementById('error'); e.textContent = msg ?? ''; e.hidden = !msg; }
async function call(name, args = {}) {
  if (S.data?.relay && ['start_run', 'rate_run', 'review_decide'].includes(name)) args = { ...args, request_id: crypto.randomUUID() };
  if (S.data?.relay && ['rate_run', 'review_decide'].includes(name) && !args.confirm) {
    throw new Error('This panel has no confirmation code for that item yet. Press Refresh and try again.');
  }
  const r = await app.callServerTool({ name, arguments: args });
  // One-time codes the Mac requires for the user's decisions (hosted relay only); the model never sees them.
  if (r?._meta?.['agents-hub/confirm']) S.confirm = r._meta['agents-hub/confirm'];
  if (r?._meta?.['agents-hub/development-confirm']) S.devConfirm = r._meta['agents-hub/development-confirm'];
  const text = r?.content?.find((c) => c.type === 'text')?.text ?? '';
  if (r?.isError) throw new Error(text.replace(/^error: /, ''));
  if (r?.structuredContent) return r.structuredContent;
  try { return JSON.parse(text); } catch { return text; }
}
async function developmentRequest(name, args = {}) {
  S.devRequests ??= new Map();
  const key = JSON.stringify([name, args]);
  const request_id = S.devRequests.get(key) ?? crypto.randomUUID();
  S.devRequests.set(key, request_id);
  const result = await call(name, { ...args, request_id });
  S.devRequests.delete(key);
  return result;
}
async function refresh() {
  if (S.refreshing || S.closed) return;
  S.refreshing = true;
  try {
    let data = await call('open_dashboard');
    const developmentAvailable = data.development_available;
    if (data.relay?.online === true) {
      try { const live = await call('panel_data'); data = { ...live, health: dashboardHealth(data, live) }; }
      catch (e) { data.relay.error = e.message; }
    }
    data.development_available = developmentAvailable;
    if (developmentAvailable) S.development = await call('development_panel');
    setData(data); showError(data.relay?.error);
  }
  catch (e) { showError(`Could not refresh: ${e.message}`); }
  finally { S.refreshing = false; scheduleRefresh(); }
}
function scheduleRefresh() {
  clearTimeout(S.poll);
  if (document.hidden || S.closed) return;
  // Hosted data changes only when the Mac publishes. Local running tasks need faster updates.
  const active = !S.data?.snapshot && S.data?.runs.some((r) => r.status === 'running');
  S.poll = setTimeout(refresh, active ? 4000 : 30000);
}
async function act(key, fn) {
  if (S.busy.has(key)) return;
  S.busy.add(key); render();
  // Refresh owns its banner, including a successful snapshot fallback after a failed live read.
  try { await fn(); if (key !== 'refresh') showError(); } catch (e) { showError(e.message); }
  finally { S.busy.delete(key); render(); }
}

function setData(data) {
  S.data = data;
  if (S.detail?.status === 'running') loadDetail(S.detail.run_id);
  scheduleRefresh();
  render({ passive: true });
}
async function loadDetail(id) {
  try { S.detail = await call(S.data?.relay?.online && !S.data?.snapshot ? 'panel_run' : 'get_run', { run_id: id }); render({ passive: true }); } catch (e) { showError(e.message); }
}

// ---------- views ----------
function chips() {
  const st = S.data?.status; if (!st) return [];
  // pending is null when the hosted snapshot does not carry it: say so instead of showing a zero.
  const review = Number.isInteger(st.pending?.memory) && st.pending.memory >= 0 && Number.isInteger(st.pending?.proposals) && st.pending.proposals >= 0
    ? st.pending.memory + st.pending.proposals : null;
  const health = S.data.health ?? healthOf(S.data);
  return [h('span', { class: 'chip' }, `${st.agents ?? 'unknown'} agents`),
    h('span', { class: `chip${st.running ? ' on' : ''}` }, `${st.running ?? 'unknown'} running`),
    h('span', { class: `chip${review ? ' attn' : ''}` }, review === null ? 'review: unknown' : `${review} to review`),
    ...healthLabels(health).map((text) => h('span', { class: 'chip', title: text }, text))];
}
// Snapshot run=false stays false. Only live panel_data can expose remote Run controls.
const canRun = () => S.data?.capabilities?.run === true && (!S.data?.relay || S.data.relay.online === true && S.data.relay.enabled === true);
const allowedForRun = (a) => S.data?.relay ? a.remote_allowed === true : a.remote_allowed !== false;
const canDecide = () => S.data?.capabilities?.mutate === true;

function tabs() {
  const review = S.data?.pending?.length ?? 0;
  return [['runs', 'Runs'], ['agents', 'Agents'], ...(S.data?.development_available ? [['development', 'Development']] : []), ...(canDecide() ? [['review', 'Review']] : [])].map(([id, label]) =>
    h('button', { role: 'tab', 'aria-selected': String(S.tab === id), onclick: () => { S.tab = id; S.detail = null; S.form = null; render(); } },
      label, id === 'review' && review ? h('span', { class: 'badge' }, review) : null));
}

function developmentView() {
  const d = S.development;
  if (!d) return h('div', { class: 'empty' }, 'Refresh to load development sessions.');
  return h('div', { class: 'list' },
    h('div', { class: 'row' }, h('strong', {}, 'dok-dev · workflow'),
      h('div', { class: 'muted' }, d.host?.online ? 'Connected independently of your Mac.' : 'Offline. Revocation can still be recorded here.'),
      h('button', { disabled: !d.host?.online || S.busy.has('dev-new'), onclick: () => act('dev-new', async () => {
        await developmentRequest('request_development'); await refresh();
      }) }, 'New development session')),
    ...d.grants.map(g => {
      const decision = S.devConfirm?.[g.grant_id], active = g.status === 'active';
      return h('section', { class: 'row' },
        h('div', { class: 'line' }, h('strong', {}, 'dev-workflow'), h('span', { class: 'pill' }, g.status)),
        h('div', { class: 'body' }, 'Read, edit, test and commit in an independent project checkout. Export to a private review branch.'),
        h('div', { class: 'small muted' }, `Expires ${new Date(g.expires_at).toLocaleString()}. Shell network: local tests only. Project context is sent to the model provider.`),
        h('div', { class: 'small muted' }, 'This scope permits no merges, deployments or supervisor activation. ChatGPT may apply its own confirmation settings.'),
        h('div', { class: 'meta' }, `Conversation ${g.manifest.conversation_id} · workspace ${g.manifest.workspace_id.slice(0, 12)}`),
        h('div', { class: 'meta' }, g.manifest.runtime ? `Pi · ${g.manifest.runtime.provider}/${g.manifest.runtime.model} · ${g.manifest.runtime.thinking} thinking` : 'Runtime identity was not recorded by this older grant.'),
        h('details', {}, h('summary', {}, 'Approved revisions'), h('pre', {}, JSON.stringify(g.manifest, null, 2))),
        ...(g.run_ids ?? []).map(run_id => h('button', { onclick: () => act('dev-result', async () => {
          S.devRun = await call('get_development_task', { grant_id: g.grant_id, run_id }); S.devExport = null;
        }) }, `Task ${run_id.slice(0, 8)}`)),
        h('div', { class: 'small' }, g.execution_confirmed_stopped ? 'Execution confirmed stopped.' : g.status === 'revoked' ? 'Revocation recorded; waiting for execution to stop.' : 'Execution may be active.'),
        decision ? h('button', { class: decision.decision === 'approve' ? 'primary' : 'no', disabled: S.busy.has(g.grant_id), onclick: () => act(g.grant_id, async () => {
          await call('decide_development', { grant_id: g.grant_id, decision: decision.decision, confirm: decision.token });
          delete S.devConfirm[g.grant_id]; await refresh();
        }) }, decision.decision === 'approve' ? 'Approve this session' : 'Revoke session') : null,
        ['expired', 'invalidated', 'revoked'].includes(g.status) ? h('button', { disabled: !d.host?.online, onclick: () => act(g.grant_id, async () => {
          await developmentRequest('request_development', { conversation_id: g.manifest.conversation_id }); await refresh();
        }) }, 'Request approval to continue') : null,
        active ? h('form', { onsubmit: e => { e.preventDefault(); const task = new FormData(e.target).get('task');
          act('dev-task', async () => { S.devRun = await developmentRequest('start_development_task', { grant_id: g.grant_id, conversation_id: g.manifest.conversation_id, task }); await refresh(); });
        } }, h('label', {}, 'Task or follow-up', h('textarea', { name: 'task', required: true, maxlength: 16000 })),
          h('button', { type: 'submit', disabled: !d.host?.online || S.busy.has('dev-task') }, 'Run in this conversation')) : null);
    }),
    S.devRun ? h('div', { class: 'row' }, h('strong', {}, `Task: ${S.devRun.status}`), h('pre', {}, S.devRun.output ?? S.devRun.error ?? S.devRun.run_id),
      S.devRun.runtime ? h('pre', {}, JSON.stringify(S.devRun.runtime, null, 2)) : null,
      h('button', { onclick: () => act('dev-result', async () => { S.devRun = await call('get_development_task', { grant_id: S.devRun.grant_id, run_id: S.devRun.run_id }); }) }, 'Refresh task'),
      S.devRun.status === 'completed' ? h('button', { onclick: () => act('dev-export', async () => {
        S.devExport = await developmentRequest('export_development', { grant_id: S.devRun.grant_id, run_id: S.devRun.run_id });
      }) }, 'Export review branch') : null, S.devExport ? h('pre', {}, JSON.stringify(S.devExport, null, 2)) : null) : null);
}

function agentsView() {
  if (!S.data.agents.length) return h('div', { class: 'empty' }, 'No agents yet.');
  return h('div', { class: 'list' }, S.data.agents.map((a) => h('div', { class: 'row' },
    h('div', { class: 'line' },
      h('span', { class: 'name' }, a.name), h('span', { class: 'grow muted ell' }, a.description),
      a.last_run ? h('span', { class: `pill ${a.last_run.status}` }, a.last_run.status) : null,
      canRun() && allowedForRun(a) ? h('button', { onclick: () => { S.form = { agent: a.name }; render(); } }, 'Run…') : null),
    h('div', { class: 'meta' }, [a.model, a.guard && `guard: ${a.guard}`, a.workspace === 'here' ? 'works in the folder it is started in' : home(a.workspace),
      a.tools?.length ? `tools: ${a.tools.join(', ')}` : 'no tools', a.last_run && `last run ${ago(a.last_run.started)}`].filter(Boolean).join(' · ')))));
}

function runsView() {
  const runs = [...S.data.runs].reverse();
  if (!runs.length) return h('div', { class: 'empty' }, 'No runs yet.');
  return h('div', { class: 'list' }, runs.map((r) => h('div', { class: 'row click', tabindex: 0,
    onclick: () => { S.detail = { run_id: r.run_id, status: r.status }; loadDetail(r.run_id); render(); },
    onkeydown: (e) => e.key === 'Enter' && e.currentTarget.click() },
    h('div', { class: 'line' },
      h('span', { class: `pill ${r.status}` }, r.status === 'running' ? [h('span', { class: 'spin' }), ' running'] : r.status),
      h('span', { class: 'name' }, r.agent), h('span', { class: 'grow ell' }, r.title ?? firstLine(r.task)),
      r.feedback ? h('span', { class: 'small muted' }, r.feedback === 'good' ? '👍' : '👎') : null),
    h('div', { class: 'meta' }, [r.kind !== 'task' && r.kind, ago(r.started), r.status !== 'running' && `${r.tool_calls} tool call(s)`,
      r.blocked > 0 && `${r.blocked} blocked`, r.model].filter(Boolean).join(' · ')))));
}

function detailView() {
  const r = S.detail;
  const back = h('button', { class: 'back', onclick: () => { S.detail = null; render(); } }, '← All runs');
  if (!r.agent) return h('div', {}, back, h('div', { class: 'empty' }, 'Loading…'));
  const rateable = canDecide() && r.status !== 'running' && ['task', 'chat'].includes(r.kind ?? 'task');
  const rate = (rating) => act(`rate-${r.run_id}`, async () => {
    const comment = document.getElementById('rate-why')?.value || undefined;
    await call('rate_run', { run_id: r.run_id, rating, comment, ...(S.data?.relay ? { confirm: S.confirm?.rate?.[r.run_id] } : {}) });
    await loadDetail(r.run_id); await refresh();
  });
  const output = String(r.output ?? r.error ?? '').replace(/```remember\n[\s\S]*?```/g, '').trim();
  return h('div', {}, back, h('div', { class: 'row' },
    h('div', { class: 'line' }, h('span', { class: `pill ${r.status}` }, r.status), h('span', { class: 'name' }, r.agent),
      h('span', { class: 'grow muted small ell' }, r.run_id)),
    h('div', { class: 'body' }, r.task ?? r.title ?? ''),
    S.data?.snapshot ? h('div', { class: 'meta' }, 'Hosted view: title and counts only, from the last published snapshot.') : null,
    r.status === 'running' ? h('div', { class: 'meta' }, h('span', { class: 'spin' }), ` started ${ago(r.started)}; this updates on its own`) : null,
    output ? h('pre', {}, output) : null,
    h('dl', {}, ...[
      ['model', r.model], ['started', r.started && new Date(r.started).toLocaleString()], ['tools', list(r.tool_calls, ', ', 'call(s)')],
      ['commands', r.commands?.length ? r.commands.join('\n') : null], ['blocked', list(r.blocked, '\n', 'attempt(s)')],
      ['memory used', r.memory_supplied?.length], ['memory proposed', r.memory_proposed?.length ? `${r.memory_proposed.length} (see Review)` : null],
      ['tokens', r.usage?.totalTokens ?? r.tokens], ['workspace', r.workspace && home(r.workspace)],
      ['your rating', typeof r.feedback === 'string' ? r.feedback : r.feedback ? `${r.feedback.rating}${r.feedback.comment ? ` — ${r.feedback.comment}` : ''}` : null],
    ].filter(([, v]) => v !== null && v !== undefined && v !== '').flatMap(([k, v]) => [h('dt', {}, k), h('dd', { style: k === 'commands' || k === 'blocked' ? 'white-space:pre-wrap;font-family:var(--font-mono)' : null }, v)])),
    rateable ? h('div', { class: 'actions' },
      h('input', { id: 'rate-why', placeholder: 'Why (optional, your words)', 'aria-label': 'Reason for rating' }),
      h('button', { class: 'ok', disabled: S.busy.has(`rate-${r.run_id}`), onclick: () => rate('good') }, 'Good'),
      h('button', { class: 'no', disabled: S.busy.has(`rate-${r.run_id}`), onclick: () => rate('bad') }, 'Bad')) : null));
}

function reviewView() {
  if (!canDecide()) return h('div', { class: 'empty' }, 'Review actions are available only in the local Agents Hub.');
  if (!S.data.pending.length) return h('div', { class: 'empty' }, 'Nothing waiting for your review.');
  return h('div', { class: 'list' }, S.data.pending.map((p) => {
    const key = `review-${p.id}`;
    const decide = (decision) => act(key, async () => {
      const reason = decision === 'reject' ? document.getElementById(`why-${p.id}`)?.value || undefined : undefined;
      await call('review_decide', { id: p.id, decision, reason, ...(S.data?.relay ? { confirm: S.confirm?.review?.[p.id] } : {}) });
      await refresh();
    });
    return h('div', { class: 'row' },
      h('div', { class: 'line' }, h('span', { class: 'pill' }, p.kind), h('span', { class: 'name' }, p.agent ?? ''),
        h('span', { class: 'grow muted small ell' }, p.why ?? ''), h('span', { class: 'small muted' }, p.id.slice(-6))),
      h('div', { class: 'body' }, p.body),
      h('div', { class: 'actions' },
        h('input', { id: `why-${p.id}`, placeholder: 'Reason if rejecting (optional)', 'aria-label': 'Reason for rejecting' }),
        h('button', { class: 'ok', disabled: S.busy.has(key), onclick: () => decide('accept') }, 'Accept'),
        h('button', { class: 'no', disabled: S.busy.has(key), onclick: () => decide('reject') }, 'Reject')));
  }));
}

function formView() {
  if (!canRun()) return h('div', { class: 'empty' }, 'Run is unavailable: snapshot capabilities are read-only; live remote starts require an online, enabled relay and an allowed agent.');
  const agents = S.data.agents.filter(allowedForRun);
  const chosen = agents.find((a) => a.name === S.form.agent) ?? agents[0];
  const submit = (e) => {
    e.preventDefault();
    const f = new FormData(e.currentTarget);
    const args = { agent: f.get('agent'), task: String(f.get('task') ?? '').trim() };
    if (!args.task) return showError('Write a task first.');
    if (f.get('cwd')) args.cwd = String(f.get('cwd')).trim();
    if (f.get('continue')) args.continue = true;
    act('start', async () => {
      const { run_id } = await call('start_run', args);
      S.form = null; S.tab = 'runs'; S.detail = { run_id, status: 'running' };
      await refresh(); await loadDetail(run_id);
    });
  };
  return h('div', {}, h('button', { class: 'back', onclick: () => { S.form = null; render(); } }, '← Back'),
    h('form', { class: 'row', onsubmit: submit },
      h('label', {}, 'Agent', h('select', { name: 'agent', onchange: (e) => { S.form = { agent: e.target.value }; render(); } },
        agents.map((a) => h('option', { value: a.name, selected: a.name === chosen?.name }, `${a.name} — ${a.description}`)))),
      h('label', {}, 'Task', h('textarea', { name: 'task', required: true, placeholder: 'What should the agent do?' })),
      chosen?.workspace === 'here' ? h('label', {}, 'Project folder (absolute path)', h('input', { name: 'cwd', required: true, placeholder: '/Users/…/Development/project' })) : null,
      h('label', { style: 'display:flex;gap:6px;align-items:center' }, h('input', { type: 'checkbox', name: 'continue', style: 'width:auto' }), 'Continue its previous conversation'),
      h('div', { class: 'actions' }, h('button', { class: 'primary', type: 'submit', disabled: S.busy.has('start') }, S.busy.has('start') ? 'Starting…' : 'Start run'),
        h('span', { class: 'small muted' }, S.data?.relay ? 'Runs on your Mac. Keep the relay Terminal open for live access.' : 'Runs on your Mac; you can close this dashboard.'))));
}

// Background updates (polling) wait while the user is typing in the view, so focus and text are not lost.
const editing = () => { const a = document.activeElement; return !!a && document.getElementById('view').contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); };
document.addEventListener('focusout', () => setTimeout(() => { if (S.stale && !editing() && !S.form) { S.stale = false; render(); } }, 0));

function render({ passive = false } = {}) {
  document.getElementById('chips').replaceChildren(...chips());
  document.getElementById('tabs').replaceChildren(...tabs());
  document.getElementById('new').hidden = !canRun();
  if (!S.data) return;
  if (passive && (editing() || S.form)) { S.stale = true; return; } // the form never needs live data
  const view = S.form ? formView() : S.detail ? detailView() : S.tab === 'development' ? developmentView() : S.tab === 'agents' ? agentsView() : S.tab === 'review' ? reviewView() : runsView();
  // Keep what the user typed in inputs across re-renders.
  const typed = Object.fromEntries([...document.querySelectorAll('#view input[id], #view textarea[name]')].map((el) => [el.id || el.name, el.value]));
  document.getElementById('view').replaceChildren(view);
  for (const [k, v] of Object.entries(typed)) { const el = document.getElementById(k) ?? document.querySelector(`#view [name="${k}"]`); if (el && !el.value) el.value = v; }
}

// ---------- host ----------
function applyContext(ctx) {
  if (!ctx) return;
  if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
  if (ctx.styles?.variables && applyHostStyleVariables) applyHostStyleVariables(ctx.styles.variables);
  const i = ctx.safeAreaInsets;
  if (i) for (const side of ['top', 'right', 'bottom', 'left']) document.body.style.setProperty(`--inset-${side}`, `${i[side] ?? 0}px`);
  // Inline in the chat by default; hosts that offer full screen get a toggle.
  if (ctx.displayMode) S.mode = ctx.displayMode;
  if (ctx.availableDisplayModes) S.modes = ctx.availableDisplayModes;
  const expand = document.getElementById('expand');
  expand.hidden = !S.modes?.includes('fullscreen');
  expand.textContent = S.mode === 'fullscreen' ? 'Collapse' : 'Expand';
}
if (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';

document.getElementById('refresh').onclick = () => act('refresh', refresh);
document.getElementById('expand').onclick = () => act('expand', async () => {
  const r = await app.requestDisplayMode({ mode: S.mode === 'fullscreen' ? 'inline' : 'fullscreen' });
  applyContext({ displayMode: r?.mode });
});
document.getElementById('new').onclick = () => { S.form = { agent: S.form?.agent }; render(); };
app.ontoolresult = (result) => {
  const data = result?.structuredContent ?? (() => { try { return JSON.parse(result?.content?.[0]?.text ?? ''); } catch { return null; } })();
  if (data?.view === 'development' || data?.grant_id && data?.manifest?.host === 'dok-dev') {
    S.tab = 'development'; S.detail = null; S.form = null;
    refresh(); return;
  }
  if (data?.agents) { setData(data); if (data.relay?.online) refresh(); } else refresh();
};
app.onhostcontextchanged = applyContext;
app.onteardown = async () => { S.closed = true; clearTimeout(S.poll); return {}; };
document.addEventListener('visibilitychange', () => {
  if (document.hidden) clearTimeout(S.poll);
  else if (!S.closed) refresh();
});
render();
await app.connect();
applyContext(app.getHostContext());
// The host normally sends the tool result right away; ask the server ourselves only if it doesn't.
setTimeout(() => { if (!S.data) refresh(); }, globalThis.ExtApps.web ? 0 : 1500);
</script>
</body>
