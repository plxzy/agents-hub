</head>
<body><main>
<header><h1>Agents Hub</h1><div class="chips" id="chips"></div><button id="refresh">Refresh</button></header>
<div class="notice">Public fixture demo · read-only · sample data only. No task can be started from this page.</div>
<nav class="tabs" id="tabs" aria-label="Dashboard sections"></nav>
<section id="view" aria-live="polite"></section>
<footer>Sample data is deterministic and does not represent a live runner or customer result.</footer>
</main>
<script>
const DATA = /*__FIXTURE_DATA__*/;

const state = { tab:'runs', detail:null, filter:{ agent:'', status:'', pr:false, unrated:false }, open:new Set(), skip:new Set(), showArchived:false, archived:new Set(DATA.runs.filter(run=>run.archived_at).map(run=>run.run_id)) };

function archivedList() { const list=DATA.runs.filter(run=>state.archived.has(run.run_id)).slice().reverse(); return el('div',{},el('button',{class:'fold',onclick:()=>{state.showArchived=false;render();}},'← Back to runs'),list.length?el('div',{class:'list'},...list.map(run=>runCard(run,el('div',{class:'actions'},el('button',{onclick:e=>{e.stopPropagation();setArchived([run.run_id],false);}},'Restore'))))):el('div',{class:'empty'},'No archived runs.')); }

  return el('div',{},suggestions(),filters(list),shown.length?el('div',{class:'list'},...groups):el('div',{class:'empty'},'No runs match these filters.'),el('button',{class:'fold',onclick:()=>{state.showArchived=true;render();}},'Archived runs'));
}
function agents() { return el('div',{class:'list'},...DATA.agents.map(agent=>el('article',{class:'row'},el('div',{class:'line'},el('strong',{class:'name'},agent.name),el('span',{class:'grow subtle'},agent.description)),el('div',{class:'meta'},`${agent.model} · ${agent.tools.join(', ')} · ${agent.workspace}`),agent.last_run?el('div',{class:'meta'},`Last run: ${agent.last_run.status} · ${ago(agent.last_run.started)}`):null))); }

document.querySelector('#refresh').onclick=()=>render();render();
</script></body></html>
